<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Verifier - Academic NFT</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.12.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1><a href="index.html" class="home-link">Academic NFT</a></h1>
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="student.html">Student Portal</a>
            <a href="admin.html">Admin Panel</a>
            <a href="verify.html" class="active">Verify</a>
        </nav>
        <div class="header-right">
            <span id="walletAddressDisplay"></span>
            <button id="connectWalletBtn">Connect Wallet</button>
        </div>
    </header>

    <main class="container">
        <!-- Section 3: Public Verifier -->
        <section class="card glass" id="verifierSection">
            <h2>Public Verifier</h2>
            <p>Enter the Token ID to independently verify academic credentials.</p>
            <input type="number" id="verifyTokenId" placeholder="Certificate Token ID">
            <button id="verifyBtn">Verify Certificate</button>
            <div id="verifyResult" class="result"></div>
            <div id="qrcode"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
